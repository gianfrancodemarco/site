<div id="site-boot" class="site-boot" role="dialog" aria-modal="true" aria-labelledby="site-boot-title">
    <p id="site-boot-title" class="sr-only">Site boot</p>
    <div class="site-boot-cli">
        <pre class="site-boot-log" data-boot-log aria-hidden="true"></pre>
        <div class="site-boot-active-line">
            <span class="site-boot-prompt" aria-hidden="true">$</span>
            <span class="site-boot-active" data-boot-active></span>
            <span class="site-boot-cursor" data-boot-cursor aria-hidden="true"></span>
        </div>
    </div>
    <button type="button" class="site-boot-skip" data-boot-skip>Skip</button>
</div>
<script>
  (function () {
    try {
      var skip =
        sessionStorage.getItem("gdm-site-boot") === "1" ||
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (skip) {
        document.documentElement.classList.add("site-boot-skip");
        var el = document.getElementById("site-boot");
        if (el) {
          el.remove();
        }
      }
    } catch (e) {
      document.documentElement.classList.add("site-boot-skip");
      document.getElementById("site-boot")?.remove();
    }
  })();
</script>
