<article class="post-title">
    {{ if .Params.externalUrl }}
    <a href="{{ .Params.externalUrl }}" class="post-link" target="_blank" rel="noopener noreferrer">{{ .Title }} <span class="external-badge external-badge--inline" title="Opens external site"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></span></a>
    {{ else }}
    <a href="{{ .RelPermalink }}" class="post-link">{{ .Title }}</a>
    {{ end }}
    <div class="flex-break"></div>
    <span class="post-date">{{ dateFormat (or .Site.Params.dateFormat "January 2, 2006") .Date}}</span>
</article>
